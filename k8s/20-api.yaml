# API de citas medicas.
# El numero de replicas se cambia con:  kubectl -n citas scale deployment/citas-api --replicas=N
# Las replicas se reparten de forma pareja entre los nodos disponibles (topologySpreadConstraints).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: citas-api
  namespace: citas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: citas-api
  template:
    metadata:
      labels:
        app: citas-api
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: citas-api
      containers:
        - name: api
          image: citas-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql://citas_user:citas_pass@citas-db:5432/citas_db
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          # Solo startupProbe: marca el pod como listo al arrancar, pero no lo retira
          # del servicio si la API se satura durante una prueba de carga (con readiness o
          # liveness, /health fallaria bajo sobrecarga y alteraria el experimento).
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 2
            failureThreshold: 60
---
apiVersion: v1
kind: Service
metadata:
  name: citas-api
  namespace: citas
spec:
  type: NodePort
  selector:
    app: citas-api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
