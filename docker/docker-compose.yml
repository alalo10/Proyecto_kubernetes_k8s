services:
  db:
    image: postgres:16
    container_name: citas-db
    environment:
      POSTGRES_USER: citas_user
      POSTGRES_PASSWORD: citas_pass
      POSTGRES_DB: citas_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citas_user -d citas_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ../app
    image: citas-api:1.0
    container_name: citas-api
    environment:
      DATABASE_URL: postgresql://citas_user:citas_pass@db:5432/citas_db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
